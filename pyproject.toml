[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-life-search-ranking-ml-lab"
version = "0.1.0"
description = "Synthetic local-life search ranking, conversion prediction and counterfactual evaluation lab."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.scripts]
search-rank-ml = "search_rank_ml.__main__:main"
